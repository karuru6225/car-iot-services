name: Firmware Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

env:
  AWS_REGION: ap-northeast-1

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [1, 2]
    permissions:
      contents: write      # GitHub Release 作成
      id-token: write      # OIDC トークン取得（AWS assume role に必要）

    steps:
      - uses: actions/checkout@v4

      - name: タグからバージョンを抽出
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: config.h の FIRMWARE_VERSION を書き換え
        run: |
          sed -i 's/#define FIRMWARE_VERSION "[^"]*"/#define FIRMWARE_VERSION "${{ steps.ver.outputs.version }}+"/' \
            esp32_iot_gateway/src/config.h

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO キャッシュ
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esp32_iot_gateway/.pio/libdeps
          key: pio-${{ hashFiles('esp32_iot_gateway/platformio.ini') }}

      - name: PlatformIO インストール
        run: pip install platformio

      - name: ファームウェアビルド（v${{ matrix.board }}-release env）
        run: pio run -e esp32-s3-devkitc-1-v${{ matrix.board }}-release
        working-directory: esp32_iot_gateway

      - name: firmware.bin.gz を生成
        run: |
          BUILD_DIR=esp32_iot_gateway/.pio/build/esp32-s3-devkitc-1-v${{ matrix.board }}-release
          gzip -k -9 "$BUILD_DIR/firmware.bin"
          BIN=$(stat -c%s "$BUILD_DIR/firmware.bin")
          GZ=$(stat  -c%s "$BUILD_DIR/firmware.bin.gz")
          echo "Compressed: ${BIN} bytes -> ${GZ} bytes ($(( GZ * 100 / BIN ))%)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: firmware.bin.gz を S3 にアップロード
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          BUILD_DIR=esp32_iot_gateway/.pio/build/esp32-s3-devkitc-1-v${{ matrix.board }}-release
          aws s3 cp \
            "$BUILD_DIR/firmware.bin.gz" \
            "s3://${{ secrets.FIRMWARE_BUCKET }}/firmware/v${{ matrix.board }}/v${VERSION}.bin.gz"

      - name: IoT Job ドキュメントを S3 にアップロード
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          FIRMWARE_URL="https://${{ secrets.FIRMWARE_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/firmware/v${{ matrix.board }}/v${VERSION}.bin.gz"
          printf '{"operation":"ota","version":"%s","board_version":%s,"url":"%s"}' \
            "$VERSION" "${{ matrix.board }}" "$FIRMWARE_URL" > job.json
          aws s3 cp job.json "s3://${{ secrets.FIRMWARE_BUCKET }}/jobs/v${{ matrix.board }}/v${VERSION}.json"

      - name: IoT OTA ジョブを作成
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          JOB_ID="ota-v$(echo "$VERSION" | tr '.' '_')-v${{ matrix.board }}-$(date +%Y%m%d%H%M%S)"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          GROUP_ARN="arn:aws:iot:${{ env.AWS_REGION }}:${ACCOUNT_ID}:thinggroup/ota-target-car-iot-gw-v${{ matrix.board }}"

          DOC_URL="https://s3.${{ env.AWS_REGION }}.amazonaws.com/${{ secrets.FIRMWARE_BUCKET }}/jobs/v${{ matrix.board }}/v${VERSION}.json"
          aws iot create-job \
            --job-id "$JOB_ID" \
            --targets "$GROUP_ARN" \
            --document-source "$DOC_URL" \
            --timeout-config inProgressTimeoutInMinutes=90

          echo "Job: $JOB_ID"
          echo "Target group: $GROUP_ARN"

      - name: GitHub Release を作成
        uses: softprops/action-gh-release@v2
        with:
          files: |
            esp32_iot_gateway/.pio/build/esp32-s3-devkitc-1-v${{ matrix.board }}-release/firmware.bin
            esp32_iot_gateway/.pio/build/esp32-s3-devkitc-1-v${{ matrix.board }}-release/firmware.bin.gz
          generate_release_notes: true
