; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1-v2-develop

; ホストPC上でdomain層（ハードウェア非依存の純粋ロジック）だけをテストする環境。
; `pio test -e native` で実行。実機なしで動く分、domain以外（device/service）は対象外。
[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_extra_dirs = test/lib
lib_deps =
    bblanchon/ArduinoJson@^7
    config_stub
build_flags =
    -std=gnu++17
    -Wall
    -g
    -fsanitize=address
    -fsanitize=undefined
    -D BOARD_VERSION=2
    -Isrc
build_src_filter =
    -<*>
    +<domain/obd.cpp>
    +<domain/thermometer.cpp>
    +<domain/co2meter.cpp>
    +<domain/sensor_factory.cpp>
    +<domain/telemetry.cpp>

[env:esp32-s3-devkitc-1-v1-release]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_two_ota.csv
board_build.filesystem = spiffs
build_src_filter = +<*> -<provision.cpp> -<blank.cpp> -<can_minimal.cpp>

lib_deps =
    vshymanskyy/TinyGSM@^0.12.0
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit ADS1X15@^2.6.2
    h2zero/NimBLE-Arduino@^1.4.0
    ricmoo/qrcode@^0.0.1

extra_scripts = pre:extra_scripts.py

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Os
    -D BLE_MEDIAN_FILTER
    -D USE_MSGPACK
    -D LOG_STORAGE_DISABLED
    -D BOARD_VERSION=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_SM_SC=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=12

build_unflags =
    -std=gnu++11
    -O2

